services:
  velxio:
    image: sebastiansteininger/velxio:latest
    container_name: robotit-velxio
    restart: unless-stopped
    ports:
      - "${VELXIO_PORT:-3080}:80"
      - "${SIM_PORT:-8765}:8765"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/velxio.db
      - DATA_DIR=/app/data
      - IDF_PATH=/opt/esp-idf
      - IDF_TOOLS_PATH=/root/.espressif
      - ARDUINO_ESP32_PATH=/opt/arduino-esp32
      - IDF_CCACHE_ENABLE=1
      - CCACHE_DIR=/var/cache/ccache
      - VELXIO_PERSISTENT_BUILD_DIR=1
      - VELXIO_CHIP_NET=1
      - VELXIO_CHIP_NET_ROUTE=${VELXIO_CHIP_NET_ROUTE:-server}
      - VELXIO_CHIP_NET_ALLOW=*.apps.htl-neufelden.at:443=https,localhost:*=http,https,127.0.0.1:*=http,https,[::1]:*=http,https
    volumes:
      - velxio-data:/app/data
      - arduino-libs:/root/.arduino15
      - ccache:/var/cache/ccache
      - velxio-build:/var/lib/velxio-build

  simulator:
    image: sebastiansteininger/robotitsim:latest
    container_name: robotit-simulator
    restart: unless-stopped
    network_mode: "service:velxio"
    depends_on:
      - velxio

volumes:
  velxio-data:
  arduino-libs:
  ccache:
  velxio-build: